name: Build and Push Studio Image

# The image only carries dependencies (the studio runs the code from its own
# clone), so it needs rebuilding only when they change.
on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - Dockerfile
      - docker-entrypoint.sh
      - .github/workflows/build-cms-image.yml
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/armanckeser/armanckeser-cms

jobs:
  build:
    # Native arm64, like the home server: no emulation, and the platform's
    # own esbuild and rollup binaries end up in node_modules.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=studio
          cache-to: type=gha,mode=max,scope=studio
          provenance: false
          sbom: false
